# The wrapper this suite ships, against the bot that talks to it.
#
# The suite installs the API wrapper release pinned in api-server-release.json
# (src/setup/management/install_api_server.js). This job installs exactly that
# release the way a host does (download, sha256 check, npm ci --omit=dev) and
# runs the bot's contract check against it (minecraft-bot:
# scripts/e2e-wrapper-contract.mjs). It is the gate for the pin bump described
# in docs/wrapper-release.md: a pin that moves to a wrapper the bot cannot use,
# or stays behind a bot that needs more, is red here instead of on an
# operator's host.
#
# The bot is checked out at its default branch. A bot change that needs a newer
# wrapper than the pin names turns this job red until the pin is bumped, which
# is the order the contract policy asks for: wrapper release, then this pin,
# then the bot.
name: Wrapper contract

on:
  push:
    paths:
      - "api-server-release.json"
      - "src/setup/management/install_api_server.js"
      - ".github/workflows/wrapper-contract.yml"
  pull_request:
    paths:
      - "api-server-release.json"
      - "src/setup/management/install_api_server.js"
      - ".github/workflows/wrapper-contract.yml"
  workflow_dispatch:
    inputs:
      bot_ref:
        description: "minecraft-bot ref to test against"
        required: false
        default: main

permissions:
  contents: read

env:
  BOT_REPO: LetsGaming/minecraft-bot
  # Read through the environment in shell steps, never interpolated into the
  # script text (S-017).
  BOT_REF: ${{ inputs.bot_ref || 'main' }}

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the suite
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: suite
          persist-credentials: false

      - name: Check out the bot
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ${{ env.BOT_REPO }}
          ref: ${{ env.BOT_REF }}
          path: bot
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      - name: Install the pinned wrapper release
        run: |
          node suite/src/setup/management/install_api_server.js --dir "$RUNNER_TEMP/api-server"
          echo "Installed: $(cat "$RUNNER_TEMP/api-server/.release.json")"

      - name: Build the bot
        working-directory: bot
        run: npm ci && npm run build

      - name: Contract check
        working-directory: bot
        env:
          WRAPPER_DIR: ${{ runner.temp }}/api-server
          E2E_DUMP_WRAPPER_LOG: "1"
          # The wrapper runs the suite scripts through sudo; the hosted runner
          # has passwordless sudo, so every route is exercised for real.
          E2E_REQUIRE_SUDO: "1"
        run: |
          if ! node -e "process.exit(require('./package.json').scripts['e2e:contract'] ? 0 : 1)"; then
            echo "::error::${BOT_REPO}@${BOT_REF} has no 'e2e:contract' script."
            exit 1
          fi
          if ! npm run e2e:contract; then
            echo "::error::The wrapper release pinned by this suite fails the bot's contract check."
            echo "Either the pin is behind what the bot now needs (bump it, see"
            echo "docs/wrapper-release.md), or the pinned release has a real regression."
            exit 1
          fi
