# The wrapper this suite ships, against the bot that talks to it.
#
# The suite installs the API wrapper release pinned in api-server-release.json
# (src/setup/management/install_api_server.js). This job installs exactly that
# release the way a host does (download, sha256 check, npm ci --omit=dev); a
# pin that does not install is red here.
#
# It then runs the bot's contract check (minecraft-bot:
# scripts/e2e-wrapper-contract.mjs) against the install. That part is
# advisory. The suite does not depend on the bot: the bot is one client of the
# wrapper this suite installs, and it depends on us. Its own contract job runs
# against the release this suite pins and is where a disagreement fails. A
# bot that has not caught up with a newer pin shows here as a warning and in
# the job summary, so the pin can move first, which is the order the contract
# policy asks for: wrapper release, then this pin, then the bot.
name: Wrapper contract

on:
  push:
    paths:
      - "api-server-release.json"
      - "src/setup/management/install_api_server.js"
      - ".github/workflows/wrapper-contract.yml"
  pull_request:
    paths:
      - "api-server-release.json"
      - "src/setup/management/install_api_server.js"
      - ".github/workflows/wrapper-contract.yml"
  workflow_dispatch:
    inputs:
      bot_ref:
        description: "minecraft-bot ref to test against"
        required: false
        default: main

permissions:
  contents: read

env:
  BOT_REPO: LetsGaming/minecraft-bot
  # Read through the environment in shell steps, never interpolated into the
  # script text (S-017).
  BOT_REF: ${{ inputs.bot_ref || 'main' }}

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the suite
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: suite
          persist-credentials: false

      - name: Check out the bot
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ${{ env.BOT_REPO }}
          ref: ${{ env.BOT_REF }}
          path: bot
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      - name: Install the pinned wrapper release
        run: |
          node suite/src/setup/management/install_api_server.js --dir "$RUNNER_TEMP/api-server"
          echo "Installed: $(cat "$RUNNER_TEMP/api-server/.release.json")"

      - name: Build the bot
        id: bot-build
        continue-on-error: true
        working-directory: bot
        run: npm ci && npm run build

      - name: Contract check
        id: contract
        if: steps.bot-build.outcome == 'success'
        # Advisory (see the header): the bot lagging behind the pin does not fail us.
        continue-on-error: true
        working-directory: bot
        env:
          WRAPPER_DIR: ${{ runner.temp }}/api-server
          E2E_DUMP_WRAPPER_LOG: "1"
          # The wrapper runs the suite scripts through sudo; the hosted runner
          # has passwordless sudo, so every route is exercised for real.
          E2E_REQUIRE_SUDO: "1"
        run: |
          if ! node -e "process.exit(require('./package.json').scripts['e2e:contract'] ? 0 : 1)"; then
            echo "${BOT_REPO}@${BOT_REF} has no 'e2e:contract' script; nothing to check against."
            exit 1
          fi
          npm run e2e:contract

      - name: Report a bot that disagrees with the pin
        if: steps.bot-build.outcome == 'failure' || steps.contract.outcome == 'failure'
        env:
          BUILD_FAILED: ${{ steps.bot-build.outcome == 'failure' }}
        run: |
          if [ "$BUILD_FAILED" = "true" ]; then
            msg="${BOT_REPO}@${BOT_REF} does not build, so it could not be checked against the pinned wrapper."
          else
            msg="${BOT_REPO}@${BOT_REF} fails its contract check against the pinned wrapper (see the Contract check step). Either the bot has not caught up with this release yet, or the release regressed; see docs/wrapper-release.md."
          fi
          echo "::warning title=bot contract::${msg}"
          {
            echo "### Bot contract: ${BOT_REPO}@${BOT_REF} disagrees with the pinned wrapper"
            echo
            echo "${msg}"
            echo
            echo "Advisory only. The bot's own contract job, which runs against this pin, is the gate."
          } >> "$GITHUB_STEP_SUMMARY"
