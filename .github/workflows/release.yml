# Publishes a GitHub release when a version tag is pushed (git tag v5.1.0 &&
# git push origin v5.1.0). The tag must match package.json, and CHANGELOG.md
# must have a section for it; that section becomes the release notes. The
# tests run first so a red commit is never released.
name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Tools the tests drive for real
        run: sudo apt-get update -q && sudo apt-get install -y -q rsync zstd acl jq screen util-linux unzip

      - run: npm ci

      - name: Shell and node tests
        run: bash tests/shell/run.sh

  release:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Check the tag against package.json and the changelog
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$pkg" != "$version" ]; then
            echo "::error::Tag $TAG does not match package.json version $pkg"
            exit 1
          fi
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          if ! grep -q '[^[:space:]]' "$RUNNER_TEMP/notes.md"; then
            echo "::error::CHANGELOG.md has no section for $version"
            exit 1
          fi

      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md" --verify-tag
