# The suite's own tests: the shell tests (tests/shell, with their shims) and the
# node tests (tests/js). They used to run only on a developer's machine, which
# is how generated sudoers rules that visudo rejects shipped while their own
# test failed (S-017).
name: Tests

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Tools the tests drive for real
        run: sudo apt-get update -q && sudo apt-get install -y -q rsync zstd acl jq screen util-linux unzip

      - run: npm ci

      - name: Shell and node tests
        run: bash tests/shell/run.sh

      # The same suites once more with the real rsync and zstd instead of the
      # shims, so the mirror staging and the archive stream are exercised as
      # they run in production.
      - name: Backup, restore, rollback and cleanup suites with real tools
        env:
          MC_TEST_REAL_TOOLS: "1"
        run: bash tests/shell/run.sh test_backup.sh test_restore.sh test_rollback.sh test_cleanup.sh test_run_backup.sh

      # Debian and Ubuntu create a user's files group-writable (umask 002); the
      # suites above run under the runner's 022, which hid a staging mirror that
      # came back group-writable after a refresh.
      - name: Backup suites under umask 002
        env:
          MC_TEST_REAL_TOOLS: "1"
        run: bash -c 'umask 002 && bash tests/shell/run.sh test_backup.sh test_run_backup.sh'
