name: ShellCheck

on:
  push:
    branches: ["**"]
    paths:
      - "**.sh"
      - ".shellcheckrc"
      - ".github/workflows/shellcheck.yml"
  pull_request:
    branches: ["**"]
    paths:
      - "**.sh"
      - ".shellcheckrc"

permissions:
  contents: read

jobs:
  shellcheck:
    name: Static analysis (ShellCheck)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # 2.0.0
        with:
          # Code suppressions live in .shellcheckrc so they apply locally too.
          # Valid inputs: additional_files, ignore, ignore_paths, ignore_names,
          #   severity, check_together, scandir, disable_matcher, format, version
          severity: warning
          scandir: "."
          # Nothing is excluded. (The API wrapper is no longer vendored here: it
          # is installed from its own release, see docs/wrapper-release.md.)
